<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Do Good Work Tee measurement diagram</title>
  <desc id="desc">Front view of a blue short-sleeved T-shirt. Dimension arrows show shoulder width, chest width, sleeve length, and body length.</desc>
  <defs>
    <marker id="dimArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0 L8 4" fill="none" stroke="#374151" stroke-width="1.2"/>
    </marker>
    <style>
      .shirt { fill: #2B4CDE; stroke: #1F2937; stroke-width: 4; stroke-linejoin: round; }
      .seam { fill: none; stroke: #DCE4FF; stroke-width: 3; stroke-linecap: round; }
      .dim { fill: none; stroke: #374151; stroke-width: 2; marker-start: url(#dimArrow); marker-end: url(#dimArrow); }
      .guide { stroke: #9CA3AF; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .label { fill: #1F2937; font: 700 20px Inter, Arial, sans-serif; }
      .label-bg { fill: #FFFFFF; }
    </style>
  </defs>
  <!-- Shirt silhouette -->
  <path class="shirt" d="M250 115 L292 88 Q360 124 428 88 L470 115 L610 205 L555 318 L474 284 L474 488 L246 488 L246 284 L165 318 L110 205 Z"/>
  <!-- Collar and construction seams -->
  <path d="M292 88 C296 145 424 145 428 88" fill="none" stroke="#1F2937" stroke-width="4"/>
  <path d="M302 99 C307 137 413 137 418 99" fill="none" stroke="#DCE4FF" stroke-width="4"/>
  <path class="seam" d="M250 115 L246 284 M470 115 L474 284 M246 488 H474"/>
  <path class="seam" d="M165 318 L246 284 M555 318 L474 284"/>
  <!-- Shoulder width -->
  <path class="guide" d="M250 72 V112 M470 72 V112"/>
  <path class="dim" d="M258 72 H462"/>
  <rect class="label-bg" x="304" y="39" width="112" height="28" rx="5"/>
  <text class="label" x="360" y="60" text-anchor="middle">SHOULDER</text>
  <!-- Chest width -->
  <path class="guide" d="M246 284 V350 M474 284 V350"/>
  <path class="dim" d="M254 350 H466"/>
  <rect class="label-bg" x="318" y="334" width="84" height="28" rx="5"/>
  <text class="label" x="360" y="355" text-anchor="middle">CHEST</text>
  <!-- Sleeve/arm measurement -->
  <path class="guide" d="M490 125 L620 210 M555 318 L635 335"/>
  <path class="dim" d="M516 151 L590 276"/>
  <rect class="label-bg" x="554" y="195" width="62" height="28" rx="5" transform="rotate(59 585 209)"/>
  <text class="label" x="585" y="215" text-anchor="middle" transform="rotate(59 585 215)">ARM</text>
  <!-- Body length -->
  <path class="guide" d="M205 284 H238 M205 488 H238"/>
  <path class="dim" d="M205 292 V480"/>
  <rect class="label-bg" x="105" y="365" width="90" height="28" rx="5"/>
  <text class="label" x="150" y="386" text-anchor="middle">LENGTH</text>
</svg>